name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [content-update]
  workflow_dispatch:
  # Weekly rebuild to pick up Google Sheet changes (publications, social feed):
  # Monday 00:00 Sri Lanka time (UTC+5:30) = Sunday 18:30 UTC.
  schedule:
    - cron: "30 18 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run that starts while another is deploying waits instead of failing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v5

      - name: Print trigger info
        run: echo "Triggered by ${{ github.event.client_payload.source || github.event_name }}"

      - name: Prepare site inputs
        uses: ./.github/actions/prepare-site

      - name: Install, build, and upload your site
        uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
